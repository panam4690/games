<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>夜勤ブロック崩し</title>
<style>
html,body{margin:0;height:100%;background:#0b0a10;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
canvas{display:block;width:100%;height:100%}
.b{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));width:66px;padding:11px 0;text-align:center;color:#f3e9d2;background:#2a2433cc;border:2px solid #8a7a5a;border-radius:10px;font-size:15px}
.b.on{background:#8a2222e6;border-color:#f0b060}
#bl{left:calc(10px + env(safe-area-inset-left))}#br{right:calc(10px + env(safe-area-inset-right))}
#bt{left:calc(50% - 72px)}#bk{left:calc(50% + 6px);font-size:13px}
</style></head><body>
<canvas id="c"></canvas>
<div class="b" id="bl">左</div><div class="b" id="bt">上</div><div class="b" id="bk">固定:ON</div><div class="b" id="br">右</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,fx,fy,fw,fh;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);fh=H*.6;fw=fh*1.6;if(fw>W*.5){fw=W*.5;fh=fw/1.6}fx=(W-fw)/2;fy=H*.1}
addEventListener('resize',rs);rs();
const L=(a,b,t)=>a+(b-a)*t;
let st='title',day=1,power=100,lives=3,sh=[0,0,0],cl=[0,0,0],lock=true,AC=null,overT=0,msg='',time=0;
let mon=[0,1,2].map(()=>({p:0,s:0,t:5,b:0,k:0}));
let pad,ball,blocks;
const COL=['#c0452e','#d98a2b','#d8c25a','#6a9a6a','#5a7aa8','#8a5aa0'];
function newDay(){const rows=3+Math.min(day,3);blocks=[];for(let r=0;r<rows;r++)for(let c=0;c<10;c++)blocks.push({x:20+c*44,y:26+r*19,r,a:1});
pad={x:240,w:78,y:258,h:9};ball={x:240,y:250,vx:0,vy:0,w:1.2};power=100;lives=3;sh=[0,0,0];cl=[0,0,0];
mon.forEach((m,i)=>{m.p=0;m.s=0;m.t=6+i*3+Math.random()*3;m.b=0;m.k=0})}
function beep(f,v,d,ty){if(!AC)return;const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,n);a.gain.setValueAtTime(v,n);a.gain.linearRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}
function scream(){for(let i=0;i<6;i++)beep(200+Math.random()*900,.8,.5,'sawtooth')}
function go(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();
if(st=='title'){day=1;newDay();st='play'}else if(st=='clear'){day++;newDay();st='play'}else if(st=='over'&&overT>1)st='title'}
function over(m,mo){st='over';msg=m;overT=0;if(mo)scream()}
// 入力
let lx=null;
function ts(e){if(lock)e.preventDefault();lx=e.touches[0].clientX;go()}
function tm(e){if(lock)e.preventDefault();const x=e.touches[0].clientX;if(lx!=null&&st=='play'){pad.x=Math.max(pad.w/2,Math.min(480-pad.w/2,pad.x+(x-lx)*(480/fw)*2.2))}lx=x}
function te(e){if(lock)e.preventDefault();lx=null}
cv.addEventListener('touchstart',ts,{passive:false});cv.addEventListener('touchmove',tm,{passive:false});cv.addEventListener('touchend',te,{passive:false});
cv.addEventListener('mousemove',e=>{if(st=='play')pad.x=Math.max(pad.w/2,Math.min(480-pad.w/2,(e.clientX-fx)*480/fw))});
cv.addEventListener('click',e=>{if(e.detail)go()});
['bl','br','bt'].forEach((id,k)=>{const i=[0,1,2][k];document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();if(st!='play')return;if(power<=0)return;sh[i]=sh[i]?0:1;beep(120,.5,.12,'sine')})});
const bk=document.getElementById('bk');bk.addEventListener('pointerdown',e=>{e.preventDefault();lock=!lock;bk.textContent='固定:'+(lock?'ON':'OFF')});
// 更新
function upd(dt){time+=dt;if(st=='over'){overT+=dt;return}if(st!='play')return;
let closed=0;for(let i=0;i<3;i++){if(power<=0)sh[i]=0;cl[i]+=(sh[i]-cl[i])*Math.min(1,dt*8);if(sh[i])closed++}
power=Math.max(0,power-dt*(.4+closed*2.6));
const sp=.14+.022*day;
mon.forEach((m,i)=>{if(m.s==0){m.t-=dt;if(m.t<=0){m.s=1;m.p=0;m.b=0}}
else if(m.s==1){m.p+=dt*sp*(power<=0?1.6:1);if(m.p>.35){m.b-=dt;if(m.b<=0){beep(440+i*160,.75,.2);m.b=Math.max(.22,.9-m.p*.7)}}
if(m.p>=1){if(cl[i]>.8){m.s=2;m.k=0}else{over(['左の窓','右の窓','天井の通気口'][i]+'から化け物が入ってきた','x');return}}}
else{m.p-=dt*.55;if(m.k==0){beep(90,.9,.25,'sine');m.k=1}
if(cl[i]<.5&&m.p>.5)m.s=1;if(m.p<=0){m.s=0;m.p=0;m.t=Math.max(2,5-day*.4)+Math.random()*5}}});
// ブロック崩し
const bs=250+28*day;
if(ball.w>0){ball.w-=dt;ball.x=pad.x;ball.y=pad.y-8;if(ball.w<=0){ball.vx=bs*(Math.random()<.5?-.4:.4);ball.vy=-bs*.9}}
else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.x<6){ball.x=6;ball.vx=Math.abs(ball.vx)}if(ball.x>474){ball.x=474;ball.vx=-Math.abs(ball.vx)}if(ball.y<6){ball.y=6;ball.vy=Math.abs(ball.vy)}
if(ball.vy>0&&ball.y+6>=pad.y&&ball.y<pad.y+pad.h&&Math.abs(ball.x-pad.x)<pad.w/2+6){const q=(ball.x-pad.x)/(pad.w/2);ball.vx=bs*q*.95;ball.vy=-Math.sqrt(Math.max(bs*bs*.3,bs*bs-ball.vx*ball.vx));beep(300,.2,.06,'triangle')}
for(const b of blocks){if(!b.a)continue;if(ball.x+6>b.x&&ball.x-6<b.x+42&&ball.y+6>b.y&&ball.y-6<b.y+17){b.a=0;power=Math.min(100,power+1.3);beep(600+b.r*60,.15,.05,'triangle');if(ball.x>b.x&&ball.x<b.x+42)ball.vy*=-1;else ball.vx*=-1;break}}
if(ball.y>312){lives--;if(lives<=0){over('玉を落としきった');return}ball.w=1.2;ball.vx=ball.vy=0}
if(blocks.every(b=>!b.a)){st='clear';beep(660,.3,.4,'triangle')}}}
// 描画
function P(i,a,b){if(i<2){const x=L(0,fx,a),yt=L(0,fy,a),yb=L(H,fy+fh,a);return[i?W-x:x,L(yt,yb,b)]}const xl=L(0,fx,a);return[L(xl,W-xl,b),L(0,fy,a)]}
function Q(i,a0,a1,b0,b1,k){const e=b0+(b1-b0)*k;return[P(i,a0,b0),P(i,a1,b0),P(i,a1,e),P(i,a0,e)]}
function poly(p,f,s,lw){g.beginPath();p.forEach((q,j)=>j?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();if(f){g.fillStyle=f;g.fill()}if(s){g.strokeStyle=s;g.lineWidth=lw||2;g.stroke()}}
function win(i){return i<2?[.15,.7,.22,.8]:[.2,.7,.3,.7]}
function monster(i,m){const w=win(i),f=Q(i,w[0],w[1],w[2],w[3],1),xs=f.map(q=>q[0]),ys=f.map(q=>q[1]);
const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,ww=Math.max(...xs)-Math.min(...xs),hh=Math.max(...ys)-Math.min(...ys);
g.save();poly(f);g.clip();g.fillStyle='#2c3f6a';g.fillRect(cx-ww,cy-hh,ww*2,hh*2);
if(m.s>0&&m.p>0){const s=Math.min(ww,hh*1.5)*(.25+.85*Math.min(1,m.p));g.fillStyle='#08050a';g.beginPath();g.ellipse(cx,cy+hh*.2*(1-m.p),s*.5,s*.62,0,0,7);g.fill();
g.fillStyle='#ff3030';g.shadowColor='#f00';g.shadowBlur=12;for(const d of[-1,1]){g.beginPath();g.arc(cx+d*s*.17,cy-s*.08+hh*.2*(1-m.p),s*.07,0,7);g.fill()}g.shadowBlur=0;
if(m.p>.65){g.fillStyle='#eee';for(let j=-2;j<=2;j++)g.fillRect(cx+j*s*.07-s*.02,cy+s*.2+hh*.2*(1-m.p),s*.04,s*.09)}}
g.restore();
const danger=m.s==1&&m.p>.5;poly(f,null,danger?'rgba(255,60,60,'+(.5+.5*Math.sin(time*14))+')':'#6a5a40',danger?4:3);
if(cl[i]>.02){const c=Q(i,w[0],w[1],w[2],w[3],cl[i]);poly(c,'#5a4e58','#2a2230',2);g.strokeStyle='#3a303c';g.lineWidth=1.5;for(let j=1;j<7;j++){const q=L(w[2],w[3],j/7*cl[i]),a=P(i,w[0],q),b=P(i,w[1],q);if(i==2){const u=L(w[2],w[3],j/7*cl[i]),a2=P(i,w[0],u),b2=P(i,w[1],u);g.beginPath();g.moveTo(a2[0],a2[1]);g.lineTo(b2[0],b2[1]);g.stroke()}else{g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}}}}
function room(){g.fillStyle='#17131d';g.fillRect(0,0,W,H);
poly([[0,H],[W,H],[W-fx,fy+fh],[fx,fy+fh]],'#2d2630');poly([[0,0],[W,0],[W-fx,fy],[fx,fy]],'#2b2638');
poly([[0,0],[fx,fy],[fx,fy+fh],[0,H]],'#3b3448');poly([[W,0],[W-fx,fy],[W-fx,fy+fh],[W,H]],'#352e42');
g.fillStyle='#211c2b';g.fillRect(fx,fy,fw,fh);
for(let i=0;i<2;i++){const f=Q(i,.78,.94,.15,.5,1);poly(f,'#8a6a40','#2a1c10',3);poly(Q(i,.8,.92,.19,.46,1),i?'#4a6a5a':'#6a4a5a');
const v=Q(i,.78,.94,.62,.8,1);poly(v,'#a8896a','#3a2a1a',2)}
for(let i=0;i<3;i++)monster(i,mon[i]);
// 床の影
g.fillStyle='rgba(0,0,0,.3)';g.fillRect(fx,fy+fh,fw,6)}
function field(){g.save();g.translate(fx,fy);g.scale(fw/480,fh/300);
g.strokeStyle='#8a7a5a';g.lineWidth=3;g.strokeRect(0,0,480,300);
for(const b of blocks){if(!b.a)continue;g.fillStyle=COL[b.r%6];g.fillRect(b.x,b.y,42,17);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(b.x,b.y+12,42,5);g.fillStyle='rgba(255,255,255,.25)';g.fillRect(b.x,b.y,42,2)}
if(pad){g.fillStyle='rgba(0,0,0,.4)';g.fillRect(pad.x-pad.w/2+3,pad.y+8,pad.w,5);g.fillStyle='#e8dcc0';g.fillRect(pad.x-pad.w/2,pad.y,pad.w,pad.h);g.fillStyle='#8a2222';g.fillRect(pad.x-pad.w/2,pad.y+pad.h-3,pad.w,3);
g.shadowColor='#fff';g.shadowBlur=10;g.fillStyle='#fff';g.beginPath();g.arc(ball.x,ball.y,6,0,7);g.fill();g.shadowBlur=0}
g.restore()}
function hud(){g.fillStyle='#f3e9d2';g.font='bold 15px "Hiragino Mincho ProN",serif';g.textAlign='left';g.fillText('第'+day+'夜',12,24);
g.fillText('残機 '+'●'.repeat(Math.max(0,lives)),12,46);g.fillText('電力',12,70);
g.fillStyle='#000a';g.fillRect(48,57,90,14);g.fillStyle=power<25?'#e03030':'#e0b050';g.fillRect(48,57,90*power/100,14);g.strokeStyle='#8a7a5a';g.lineWidth=1.5;g.strokeRect(48,57,90,14)}
function ov(t,s){g.fillStyle='rgba(8,5,12,.78)';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#f3e9d2';g.font='bold '+Math.min(34,W/14)+'px "Hiragino Mincho ProN",serif';g.fillText(t,W/2,H*.4);g.font=Math.min(16,W/34)+'px "Hiragino Mincho ProN",serif';g.fillStyle='#d8c080';s.forEach((l,i)=>g.fillText(l,W/2,H*.4+34+i*24))}
function draw(){g.clearRect(0,0,W,H);room();if(st!='title'&&pad)field();
const v=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.65);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,W,H);
if(power<25&&st=='play'){g.fillStyle='rgba(0,0,0,'+(.2+.15*Math.sin(time*9))+')';g.fillRect(0,0,W,H)}
if(st!='title')hud();
const names=['左','右','上'];for(let i=0;i<3;i++){const e=document.getElementById(['bl','br','bt'][i]);if(!!sh[i]!=e.classList.contains('on'))e.classList.toggle('on')}
if(st=='title')ov('夜勤ブロック崩し',['窓や通気口が開いたままだと化け物が入ってくる','赤く光って音が鳴ったら、そのシャッターを閉めよう','閉めている間は電力が減る・ブロックを崩すと少し回復','画面をドラッグでバー操作','タップして開始']);
else if(st=='clear')ov('第'+day+'夜 クリア',['ノルマ達成。朝が来た','タップで次の夜へ']);
else if(st=='over'){if(msg&&overT<.9&&msg.indexOf('化け物')>=0){g.fillStyle='rgba(120,0,0,'+(.9-overT)+')';g.fillRect(0,0,W,H);g.fillStyle='#ff2020';for(const d of[-1,1]){g.beginPath();g.arc(W/2+d*W*.12,H*.4,W*.04,0,7);g.fill()}}else ov('ゲームオーバー',[msg,'第'+day+'夜まで生き延びた','タップでタイトルへ'])}}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;upd(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
